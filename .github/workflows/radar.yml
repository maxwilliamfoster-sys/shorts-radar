name: Radar sweep

# Runs continuously. Each run sweeps every 30 min for ~5.5h (loop.sh), then starts the next
# run of this workflow itself. The cron is only a backstop that restarts the chain if it ever
# breaks; while a run is live, the concurrency group just queues it.
# Data lives on the `data` branch as ONE force-pushed commit, so history never grows.
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send the full report on the first sweep"
        type: boolean
        default: false
      discover:
        description: "Run channel discovery on the first sweep"
        type: boolean
        default: false
      start_now:
        description: "Autopilot: start qualifying experiments now (implies a report)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: YouTube token (optional - without it the radar runs RSS-only)
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > token.json; fi

      - name: Sweep loop
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_DISPATCH_TOKEN: ${{ secrets.RADAR_DISPATCH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.report }}
          DISCOVER: ${{ inputs.discover }}
          START_NOW: ${{ inputs.start_now }}
        run: bash loop.sh

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .chain_ok ]; then gh workflow run radar.yml --ref main -R "${{ github.repository }}"
          else echo "run was too short or failing - leaving the restart to the cron backstop"; fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Shorts Radar run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
