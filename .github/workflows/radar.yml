name: Radar daily report

# Once a day: one sweep of the chess Shorts niche, then the report (Telegram + data branch).
# Read-only: it never touches the posting pipelines.
# Data lives on the `data` branch as ONE force-pushed commit, so history never grows.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: YouTube token (optional - without it the radar runs RSS-only)
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > token.json; fi

      - name: Load data branch
        run: |
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data || mkdir -p data
          rm -rf data/.git
          # leftovers from the retired autopilot/trigger/reddit tracking (2026-10-12)
          rm -rf data/directives data/autopilot.json data/trigger.json data/insights/reddit.json

      - name: Collect
        run: python collect.py --data data

      - name: Report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analyze.py --data data --send

      - name: Save data branch
        if: ${{ !cancelled() }}
        run: |
          [ -f data/state.json ] || exit 0
          cd data
          git init -q -b data
          git config user.name "shorts-radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "radar data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Shorts Radar daily report failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
