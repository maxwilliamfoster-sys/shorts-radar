name: Radar sweep

# Every 2h: snapshot every watched channel's Shorts (RSS), discover channels every 6h,
# and once a day (first sweep after 07:00 UTC) send the Telegram report.
# Data lives on the `data` branch as ONE force-pushed commit, so history never grows.
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send a report now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch data branch
        run: |
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data || mkdir -p data
          rm -rf data/.git

      - name: YouTube token (optional - without it the radar runs RSS-only)
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > token.json; fi

      - name: Collect
        run: python collect.py --data data

      - name: Report
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.report }}
        run: |
          if [ "$FORCE" = "true" ]; then python analyze.py --data data --send
          else python analyze.py --data data --send --if-due; fi

      - name: Save data branch
        if: always()
        run: |
          [ -f data/state.json ] || exit 0
          cd data
          git init -q -b data
          git config user.name "shorts-radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "radar data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Shorts Radar sweep failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
